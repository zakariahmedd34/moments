[project]
name = "moments-backend"
version = "0.1.0"
description = "FastAPI backend for Moments, a visual daily journal"
authors = [
    {name = "Zakaria"}
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=4.2.0,<5.0.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# this is an application, not a library to publish
package = false
